# §40 Job journey — Discover → Job → Apply → Employer → Post
#
# Known open defect on this path: the Discover filter modal has five fields and
# no keyboard avoidance (F-003). Those steps are marked optional so the journey
# still reports on the rest of the chain while that is outstanding.
appId: com.diaspora.app
---
- runFlow: subflows/login.yaml

- tapOn: "Discover"
- tapOn:
    text: "Jobs"
    optional: true

- openLink: diaspora://job/job-1
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
# The CTA is labelled "Apply Now via Profile" and sits below the fold. Maestro
# text selectors are full-match regexes, so a bare "Apply" matches nothing.
- scrollUntilVisible:
    element:
      text: ".*Apply Now.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Apply Now.*"
# Applying opens a confirmation before anything is sent.
- assertVisible:
    text: ".*Apply.*"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- pressKey: back

- openLink: diaspora://employer/emp-1
- pressKey: back

# The posting side. This account does not meet the posting requirements, so the
# screen correctly renders "Job Posting Locked" with its requirements checklist
# rather than the form — role gating working, not a defect. The assertion accepts
# either, because what this journey checks is that the route resolves.
- openLink: diaspora://job/create
- extendedWaitUntil:
    visible: ".*(Post a Job|Posting Locked).*"
    timeout: 30000
- pressKey: back
