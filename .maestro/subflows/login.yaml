# Ensures the run is signed in as a verified member, signing in only if needed.
#
# ── Why this does not use `launchApp: clearState: true` ──────────────────────
#
# `clearState` runs `pm clear`, and on this emulator that reliably drops the adb
# connection for several seconds:
#
#   CommandFailed: Command failed (host:transport:emulator-5554): device offline
#   DeviceServerDiedException: Device server died during 'deviceInfo'
#
# With 18 flows each clearing state the whole suite is flaky, and it also pays
# for a full sign-in 18 times over. Instead this launches the app as-is and signs
# in only when the sign-in entry point is on screen, which is both stable and
# much faster. Flows needing a genuinely clean slate should clear once, outside
# Maestro:
#
#   adb shell pm clear com.diaspora.app
#
# ── What the mocks give us ──────────────────────────────────────────────────
#
# `initMocks()` runs unconditionally in src/app/_layout.tsx, so no backend is
# needed. From src/mocks/handlers/auth.ts:
#
#   * `000000` is the *invalid* code — it returns 401 on purpose so the error
#     path is testable. Any other six digits sign in. Hence 123456.
#   * The phone number's last three digits choose the account state; anything
#     not ending 666 / 999 / 775 yields `DiasporaVerified`. The default country
#     code is +234, which does not affect that suffix match.
#
# Override PHONE to sign in as a different account state:
#
#   - runFlow:
#       file: ../subflows/login.yaml
#       env:
#         PHONE: "7700900666"

# NOTE: no `env:` block here, deliberately — see the PHONE default below.
appId: com.diaspora.app
---
- launchApp

# `_layout.tsx` fires a location-permission Alert 500ms after mount, on top of
# whatever is showing, and it obscures the entire hierarchy while up. Declining
# keeps the run deterministic — allowing triggers a second, OS-level dialog and
# makes later screens depend on a resolved location.
- extendedWaitUntil:
    visible: "DON'T ALLOW"
    timeout: 90000
    optional: true
- tapOn:
    text: "DON'T ALLOW"
    optional: true

# Wait for the app to actually render before testing whether it is signed out.
# `runFlow: when:` evaluates its condition *immediately* — it does not wait — so
# on a cold start the condition is false simply because nothing has drawn yet,
# and the whole sign-in block is silently skipped. Optional, because when the
# app is already signed in this text never appears.
#
# The probe is the landing screen's *headline* action, not the sign-in link.
# On a 360x640 phone the link sits below the fold, and Maestro's `visible` is
# an on-screen test — so probing for it there is correctly false, the whole
# block skips, and every flow then fails on a screen nobody looked at. That is
# not a hypothetical: it is what the small-phone pass hit.
- extendedWaitUntil:
    visible: "Join Your Community"
    timeout: 90000
    optional: true

# Bring the sign-in link into view on short screens. Harmless where it is
# already visible; `optional` because on a signed-in run there is nothing to
# scroll to.
- scrollUntilVisible:
    element:
      text: "Already have an account? Sign in"
    direction: DOWN
    timeout: 8000
    optional: true

# Sign in only when the app is actually signed out. The app opens on an
# onboarding landing screen, not the sign-in form — sign-in is one tap further.
- runFlow:
    when:
      visible: "Already have an account? Sign in"
    commands:
      - tapOn: "Already have an account? Sign in"
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 20000

      - tapOn:
          id: "phone-input"
      # The default is expressed inline rather than in an `env:` block, because
      # in Maestro 2.8.0 a flow-level `env:` default takes precedence over `-e`
      # on the command line — the opposite of most CLI tools. With a default
      # here, `maestro test -e PHONE=7700900666` silently signed in as the
      # verified account instead, and the role matrix passed while testing the
      # wrong subject. Verified by reading the field back from the hierarchy.
      - inputText: "${PHONE || '7700900123'}"

      # No `hideKeyboard` here, deliberately. Reaching "Continue" with the
      # keyboard still up is the assertion — it is what F-033 broke and what the
      # fix restored. Re-adding a dismiss would hide a regression of it.
      # Continue is disabled until the field holds a value, and Maestro reports a
      # disabled element as "not found". That makes this wait do double duty:
      # waiting for Continue to become *findable* is exactly waiting for it to
      # become *enabled*, which is in turn waiting for the text to have landed.
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - tapOn: "Continue"

      - extendedWaitUntil:
          visible: "Verification code, digit 1 of 6"
          timeout: 20000
      - tapOn: "Verification code, digit 1 of 6"
      # Typing the whole code into the first box auto-advances all six, and the
      # screen submits itself on the sixth digit — so "Verify" has usually gone
      # by the time this runs. Optional rather than removed, for slower devices.
      - inputText: "123456"
      - tapOn:
          text: "Verify"
          optional: true

# The app does not always open on the onboarding landing screen. Clearing state
# and relaunching can land straight on "Welcome back", and a run interrupted
# part-way leaves it there too — in both cases the block above sees no
# "Already have an account? Sign in", concludes the app is already signed in,
# and every later step then fails on a screen nobody looked at.
#
# Same sign-in, entered one screen further along. The wait is not optional
# decoration: `runFlow: when:` evaluates its condition immediately, so without
# something to wait on, a cold start fails the check because nothing has drawn
# yet — the same trap the block above documents.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          id: "phone-input"
      - inputText: "${PHONE || '7700900123'}"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Verification code, digit 1 of 6"
          timeout: 20000
      - tapOn: "Verification code, digit 1 of 6"
      - inputText: "123456"
      - tapOn:
          text: "Verify"
          optional: true

# A guided-tour screen sits between sign-in and the tabs.
- extendedWaitUntil:
    visible: "Skip Onboarding"
    timeout: 25000
    optional: true
- tapOn:
    text: "Skip Onboarding"
    optional: true

# Signed in. Asserted as "no longer signed out" rather than "on the tabs",
# because that is only true for an unrestricted account: `_layout.tsx` redirects
# Suspended, VerificationRejected and the other restricted states straight to
# /access-gateway, which has no tab bar. Asserting Discover here made this
# subflow unusable for the role matrix it is supposed to serve.
- extendedWaitUntil:
    notVisible: "Already have an account? Sign in"
    timeout: 30000
