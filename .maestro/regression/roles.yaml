# §39 — the role and account-state matrix.
#
# `src/mocks/handlers/auth.ts` selects the account state from the phone number's
# last three digits, which makes every state reachable deterministically with no
# backend. This is the only practical way to exercise §39 in this project.
#
#   ends 666 → Suspended             → /access-gateway   EXPECT_TABS=false
#   ends 999 → VerificationRejected  → /access-gateway   EXPECT_TABS=false
#   ends 775 → LimitedAccess         → /(tabs)           EXPECT_TABS=true
#   otherwise → DiasporaVerified     → /(tabs)           EXPECT_TABS=true
#
# LimitedAccess reaching the tabs is deliberate, not a gap. `_layout.tsx`
# redirects exactly seven states — DiasporaVerificationPending,
# VerificationUnderReview, VerificationRejected, RequiresMoreInformation,
# Suspended, Restricted and AppealPending — and LimitedAccess is not among them.
# It is limited *exploration*, so it reaches content with reduced capability
# rather than being held at the gateway. Verified on device: it lands on the
# discovery surfaces.
#
# ── This flow deliberately declares NO `env:` defaults ───────────────────────
#
# An earlier version defaulted PHONE to a verified number. Passing
# `-e PHONE=7700900666` did not take effect over that default, so the run signed
# in as the *verified* account, asserted that the tabs were present, and passed —
# while appearing to have tested a suspended one. A test that silently exercises
# the wrong subject is worse than no test.
#
# With no defaults, an unset variable fails the run instead of quietly changing
# what is under test. Always pass both:
#
#   adb shell pm clear com.diaspora.app
#   maestro test -e PHONE=7700900666 -e EXPECT_TABS=false .maestro/regression/roles.yaml
#
# ── Why one state per run ────────────────────────────────────────────────────
#
# Switching accounts needs the session cleared, and the only in-flow ways to do
# that run `pm clear`, which reliably drops this emulator's adb connection
# mid-run. The matrix is therefore driven from outside Maestro, one state per
# invocation — see the command above.
#
# Verified on device: 7700900123 reaches all six destinations; 7700900666 is
# intercepted to the access gateway showing "Account Suspended", the policy
# violations, and the appeal and sign-out actions.

appId: com.diaspora.app
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      PHONE: "${PHONE}"

# ── A verified member reaches the primary destinations ───────────────────────
- runFlow:
    when:
      true: ${EXPECT_TABS == 'true'}
    commands:
      - assertVisible: "Home"
      - assertVisible: "Discover"
      - assertVisible: "Create"
      - assertVisible: "Messages"
      - assertVisible: "Knowledge"
      - assertVisible: "Profile"

# ── A restricted member is intercepted, and must NOT reach them ──────────────
# `_layout.tsx` redirects Suspended, VerificationRejected and the other
# restricted states to /access-gateway before any tab renders.
- runFlow:
    when:
      true: ${EXPECT_TABS != 'true'}
    commands:
      # The redirect to /access-gateway happens after sign-in completes, so this
      # has to wait for it. A bare assertVisible races the navigation.
      - extendedWaitUntil:
          visible: ".*(Suspended|Rejected|Restricted|Appeal).*"
          timeout: 30000
      - assertNotVisible: "Create"
      - assertNotVisible: "Knowledge"
