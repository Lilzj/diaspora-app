# §41, §36, §37 — the organisation management workspace, all five tabs, two
# organisations, two permission tiers.
#
#   maestro --device <api36-emulator> test .maestro/regression/organization-workspace.yaml
#
# ── What this proves and what it cannot ──────────────────────────────────────
#
# It proves each tab renders *something specific to that tab* — which is the
# whole point, because the failure this replaces was five tabs rendering
# nothing. Every assertion below is an exact string that appears on one tab and
# nowhere else, for the reason recorded in `dark-mode-audit.yaml`: a loose
# regex does not merely fail to prove the screen arrived, it certifies the
# wrong one.
#
# ── Two matcher rules, learned the hard way on this flow ────────────────────
#
# Three of this flow's first four runs failed against screens that were
# rendering perfectly. Both causes are properties of Maestro and of NativeWind,
# not of the app, and both are easy to repeat.
#
# **1. A text selector is a FULL-MATCH regex, not a substring search.**
#
#     rendered:  "Posts are the organisation's announcements. Listing and
#                 publishing are wired to a development adapter; editing and
#                 deleting have no contract yet."
#     matcher:   "Posts are the organisation's announcements."      ← fails
#     matcher:   "Posts are the organisation.s announcements\..*"    ← matches
#
# Quoting the first sentence of a paragraph does not match the paragraph. Any
# matcher that is a *prefix* of the node's text needs a trailing `.*`, and any
# matcher that sits in the middle needs `.*` at both ends.
#
# **2. `uppercase` transforms the string, not just the pixels.**
#
# `TabHeading` and its trailing action carry NativeWind's `uppercase`, which is
# `textTransform: 'uppercase'`, and React Native implements that by transforming
# the string before it reaches the view. The node's text really is
# "RECENT ACTIVITY · 4" and "+ NEW POST". A matcher in sentence case fails.
#
# The general lesson, which `dark-mode-audit.yaml` records a different form of:
# **a failing assertion is not evidence of a failing screen.** Look at the
# capture before believing the verdict. The first run here reported the Timeline
# tab blank while it was rendering four rows.
#
# Related: no typographic characters in a matcher. The middle dot in
# "Student Associations · Member" does not survive the round trip through YAML
# and the shell reliably, which is why the category is matched alone.
#
# It cannot prove contrast, and it cannot prove the sheet scrolls — a scroll
# that silently does nothing looks identical to a short list. Those are read
# from the captures.
#
# ── Why two organisations, in this order ────────────────────────────────────
#
# §36. Nigerian Community Association UK is Owner — every capability granted. Ghanaian
# Students & Professionals is Member — none granted. Opening the second after
# the first is the test that matters: management controls present on the first
# must be absent on the second, and none of the first organisation's data may
# survive into the second.
#
# The build must carry EXPO_PUBLIC_ENABLE_GAP_PREVIEW=1, or every tab correctly
# renders its "not available in this build" state and this flow proves nothing
# about the data. That state is itself asserted at the end of the file so a
# flagless build fails loudly rather than passing on empty tabs.

appId: com.diaspora.app
---
- runFlow: ../subflows/login.yaml

# ── Reach the Organizations section ──────────────────────────────────────────
- openLink: diaspora://profile/creator-dashboard
- extendedWaitUntil:
    visible: "Creator Studio"
    timeout: 30000
- takeScreenshot: org-00-studio

- tapOn: "🏛️ Organizations"
- extendedWaitUntil:
    visible: "Organization Operating System"
    timeout: 20000

# The card, after the CTA fix. "Manage organisation" is the button; the old
# card had "MANAGE →" wedged into the metrics row.
- assertVisible: "Manage organisation"
- assertVisible: "Nigerian Community Association UK"
- takeScreenshot: org-01-cards

# ── Organisation A — Owner, every capability ─────────────────────────────────
- tapOn:
    text: "Manage organisation"
    index: 0
- extendedWaitUntil:
    visible: "RECENT ACTIVITY.*"
    timeout: 25000
- assertVisible: "Nigerian Community Association UK"
- takeScreenshot: org-02-a-timeline

- tapOn: "Posts"
- extendedWaitUntil:
    visible: "Posts are the organisation.s announcements..*"
    timeout: 20000
# The composer entry point, which only a caller holding canPublishAnnouncements
# is shown. Its absence on organisation B is the §37 assertion.
- assertVisible: ".*NEW POST"
- takeScreenshot: org-03-a-posts

- tapOn: "Events"
- extendedWaitUntil:
    visible: "Event series come from a development adapter..*"
    timeout: 20000
- assertVisible: ".*HOST EVENT"
- takeScreenshot: org-04-a-events

- tapOn: "Members"
- extendedWaitUntil:
    visible: "The roster, roles and join dates come from a development adapter..*"
    timeout: 20000
- takeScreenshot: org-05-a-members

# §17 — the search box, and that typing into it does not make the list unusable.
#
# Tapped by its accessibility label rather than its placeholder: the placeholder
# is `Search {n} members` when a total is known and `Search members of {org}`
# when it is not, so matching on it is matching on a race.
- tapOn: "Search members"
- inputText: "a"
- extendedWaitUntil:
    visible: "MATCHING MEMBERS.*"
    timeout: 15000
- takeScreenshot: org-06-a-members-search
- eraseText

# The keyboard has to go before the next tab is tapped. With it open, the first
# tap anywhere is consumed dismissing it — Maestro reports the tap COMPLETED,
# because it did land, and the tab does not change. That reads in the log as
# "tapped Roles, Roles did not appear", which looks like a broken tab and is
# not.
- hideKeyboard

- tapOn: "Roles"
- extendedWaitUntil:
    visible: "ROLES IN THIS ORGANISATION.*"
    timeout: 20000
# The catalogue, which is what this tab became. The old one showed only the
# caller's own permission strings.
- assertVisible: "YOUR ROLE HERE"
- takeScreenshot: org-07-a-roles

# `assertVisible` requires the element to be ON SCREEN, not merely present. An
# Owner's capability card lists all ten flags, so only the first two of the six
# roles are above the fold — a bare assertion on Treasurer fails against a
# catalogue that is entirely correct. Scrolling to it proves two things at once:
# the catalogue is complete, and the sheet scrolls, which the modal this
# replaces could not.
- scrollUntilVisible:
    element:
      text: "Treasurer"
    direction: DOWN
    timeout: 20000
- assertVisible: "Moderator"
- takeScreenshot: org-08-a-roles-catalogue

# The disclaimer that separates the authoritative half from the descriptive one.
- scrollUntilVisible:
    element:
      text: ".*Custom roles are not supported.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: org-08b-a-roles-scrolled

# ── Close, and open organisation B — Member, no capabilities ─────────────────
#
# `back` rather than tapping the close control: `Sheet` wires the Android back
# button to `onRequestClose`, so this exercises the dismissal path a member
# actually uses on Android, and it does not depend on where the ✕ is drawn.
- back
- extendedWaitUntil:
    visible: "Organization Operating System"
    timeout: 20000

# Reached through the role filter rather than by index. `index: 2` counts
# among the elements Maestro can currently see, and scrolling the third card
# into view takes the first two out of it — so the index that was correct
# before the scroll does not exist after it.
#
# The filter is the better route anyway: the chips carry counts derived from
# the data, which the old ones did not — they read "Owned (1)", "Managed (1)"
# and so on regardless of what was in the list. Tapping one is the assertion
# that the count is real.
- tapOn: "Contributed 1"
- extendedWaitUntil:
    visible: "Ghanaian Students & Professionals Association.*"
    timeout: 20000
- tapOn:
    text: "Manage organisation"
    index: 0
- extendedWaitUntil:
    visible: "RECENT ACTIVITY.*"
    timeout: 25000

# §36 — the header is organisation B's, not A's.
#
# A positive assertion on something only B has, rather than a negative one on
# A's name: the sheet is a `Modal`, so the card list behind it is still in the
# hierarchy, and asserting A's name is *not* present would be asserting
# something about the scrim rather than about the sheet.
- assertVisible: "Ghanaian Students & Professionals Association.*"
# No middle dot in the matcher. `dark-mode-audit.yaml` records that a
# typographic character does not survive the round trip through YAML and the
# shell reliably, and the subtitle is "Student Associations · Member".
# The category alone separates the three: "Cultural association",
# "Professional network", "Student Associations".
- assertVisible: "Student Associations.*"
- takeScreenshot: org-09-b-timeline

# §37 — a Member sees no management control on any tab.
- tapOn: "Posts"
- extendedWaitUntil:
    visible: "Posts are the organisation.s announcements..*"
    timeout: 20000
- assertNotVisible: ".*NEW POST"
- takeScreenshot: org-10-b-posts-no-controls

- tapOn: "Events"
- extendedWaitUntil:
    visible: "Event series come from a development adapter..*"
    timeout: 20000
- assertNotVisible: ".*HOST EVENT"
- takeScreenshot: org-11-b-events-no-controls

- tapOn: "Roles"
- extendedWaitUntil:
    visible: "ROLES IN THIS ORGANISATION.*"
    timeout: 20000
# The read-only statement, which appears only when every capability is false.
- assertVisible: "You can read this organisation but not manage any part of it..*"
# Roles renders despite its roster query being refused — the caller's own
# capabilities and the catalogue are readable by everyone, and an earlier
# version took the whole tab down with the roster.
- assertVisible: "Owner"
- scrollUntilVisible:
    element:
      text: "Treasurer"
    direction: DOWN
    timeout: 20000
- takeScreenshot: org-12-b-roles-readonly

# The roster endpoint 403s without `canManageMembers`, so a Member gets a
# refusal here rather than an empty list. The distinction is the point: "no
# members" and "you may not see the members" are different facts, and the first
# was what an earlier version of this tab said.
- tapOn: "Members"
- extendedWaitUntil:
    visible: ".*does not include seeing who belongs to it.*"
    timeout: 20000
# A refusal offers no retry — retrying a 403 refuses again.
- assertNotVisible: "Try again"
- assertNotVisible: "MATCHING MEMBERS.*"
- takeScreenshot: org-13-b-members-refused

# ── §31 — the same workspace in dark ─────────────────────────────────────────
- openLink: diaspora://settings/appearance
- extendedWaitUntil:
    visible: "System default"
    timeout: 20000
- tapOn: "Dark"

- openLink: diaspora://profile/creator-dashboard
- extendedWaitUntil:
    visible: "Creator Studio"
    timeout: 25000
- tapOn: "🏛️ Organizations"
- extendedWaitUntil:
    visible: "Organization Operating System"
    timeout: 20000
- takeScreenshot: org-14-cards-dark

# The role filter has to be cleared first. `activeRoleTab` lives in
# `store/organization.ts`, so the "Contributed" filter set above is still in
# force after leaving and returning — which is correct for a store and means
# `index: 0` would be the Member organisation rather than the Owner one. The
# dark pass would then have captured the refusal states and called them the
# workspace.
- tapOn: "All orgs 3"
- tapOn:
    text: "Manage organisation"
    index: 0
- extendedWaitUntil:
    visible: "RECENT ACTIVITY.*"
    timeout: 25000
# Names the organisation, so opening the wrong one fails here rather than
# producing a plausible-looking dark capture of the wrong screen.
- assertVisible: "Nigerian Community Association UK"
- takeScreenshot: org-15-a-timeline-dark

- tapOn: "Members"
- extendedWaitUntil:
    visible: "The roster, roles and join dates come from a development adapter..*"
    timeout: 20000
- takeScreenshot: org-16-a-members-dark

- tapOn: "Roles"
- extendedWaitUntil:
    visible: "ROLES IN THIS ORGANISATION.*"
    timeout: 20000
- takeScreenshot: org-17-a-roles-dark

# ── Leave the device as it was found ─────────────────────────────────────────
- openLink: diaspora://settings/appearance
- extendedWaitUntil:
    visible: "System default"
    timeout: 20000
- tapOn: "Light"
