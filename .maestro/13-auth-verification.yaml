# §40 Authentication and verification journey.
#
# Deliberately does NOT run the shared login subflow — it exercises sign-in
# itself, including the error path that the other flows skip past.
#
# Three things this flow has to do that reading the source would not tell you:
#
#   * The app opens on an onboarding landing screen, not the sign-in form.
#   * A location-permission Alert fires 500ms after mount and obscures the whole
#     hierarchy until it is dismissed.
#   * `clearState: true` runs `pm clear`, which drops the adb connection on this
#     emulator. State is cleared outside Maestro instead:
#         adb shell pm clear com.diaspora.app

appId: com.diaspora.app
---
- launchApp

- extendedWaitUntil:
    visible: "NOT NOW"
    timeout: 90000
    optional: true
- tapOn:
    text: "NOT NOW"
    optional: true

# Only exercise sign-in when actually signed out; the suite may have left a
# session behind.
- runFlow:
    when:
      visible: "Already have an account? Sign in"
    commands:
      - tapOn: "Already have an account? Sign in"
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000

      - tapOn:
          id: "phone-input"
      - inputText: "7700900123"

      # Reaching Continue with the keyboard still up is the F-033 assertion.
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - tapOn: "Continue"

      - extendedWaitUntil:
          visible: "Verification code, digit 1 of 6"
          timeout: 30000

      # `000000` is the mock's deliberate invalid code. The failure must surface
      # on the screen the member is already on, rather than advancing them to
      # wait for a code that was never sent.
      - tapOn: "Verification code, digit 1 of 6"
      - inputText: "000000"
      - tapOn:
          text: "Verify"
          optional: true
      # The copy is "That code is not right." — deliberately not "invalid" and
      # deliberately not "your session expired". `verifyOtp` maps 401 to a wrong
      # code, because the token cannot have expired on a screen the member has
      # only just reached. Asserted on the real string so a regression in that
      # mapping shows up as a failure rather than a warning.
      - assertVisible: ".*code is not right.*"

      # Now the valid path. Any other six digits sign in.
      - tapOn: "Verification code, digit 1 of 6"
      - inputText: "123456"
      - tapOn:
          text: "Verify"
          optional: true

- extendedWaitUntil:
    visible: "Skip Onboarding"
    timeout: 30000
    optional: true
- tapOn:
    text: "Skip Onboarding"
    optional: true

- extendedWaitUntil:
    visible: "Discover"
    timeout: 30000

# ── The verification surfaces ────────────────────────────────────────────────
- openLink: diaspora://verification/phone
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
    optional: true
- pressKey: back

- openLink: diaspora://verification/identity
- pressKey: back

# `country` was moved onto the shared keyboard container in this audit.
- openLink: diaspora://verification/country
- pressKey: back

- openLink: diaspora://verification/diaspora
