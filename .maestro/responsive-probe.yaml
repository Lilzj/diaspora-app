# Layout at 360x640dp — the smallest phone the product realistically meets.
#
# Looking for content that clips, controls that fall off the edge, and rows
# that collapse into each other, not for colour.
appId: com.diaspora.app
---
- runFlow: subflows/login.yaml

- openLink: diaspora://discover
- extendedWaitUntil:
    visible: "Discovery Radius"
    timeout: 30000
- takeScreenshot: r-discover

- openLink: diaspora://job/job-1
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- takeScreenshot: r-job

- openLink: diaspora://wallet
- extendedWaitUntil:
    visible: ".*[Ww]allet.*"
    timeout: 30000
- takeScreenshot: r-wallet

- openLink: diaspora://profile
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: r-profile
