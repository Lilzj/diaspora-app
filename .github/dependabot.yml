# Dependabot — FSEC-001 remediation item 3.
#
# The finding's root cause was not a bad decision about dependencies; it was the
# absence of any decision. 35 advisories had accumulated, 1 critical and 17
# high, and "nothing in this repository's process would notice the 36th".
# `scripts/dependency-audit.js` is what notices one that arrives. This file is
# what makes them arrive less often, by opening the upgrade before the advisory
# does.
#
# ── What this file does and does not cover ──────────────────────────────────
#
# Version updates only. Dependabot *security* updates — the ones raised against
# an advisory rather than a release — are a repository setting, not a key in
# this file: Settings → Code security → Dependabot alerts, and Dependabot
# security updates. Both are off until somebody turns them on, and this file
# cannot do it. Weekly version updates will still carry most fixes, because a
# patched release is a release.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday

    # Enough for the long tail to flow without burying a Monday in review.
    # It does not apply to security updates, which are unlimited by design.
    open-pull-requests-limit: 10

    groups:
      # One pull request for the whole Expo surface, which is the only way this
      # can be reviewed at all.
      #
      # 17 of this project's 44 dependencies are pinned to the Expo 57 line, and
      # `expo-router@58` names six more `@expo/*` packages as peers at `^58`.
      # An SDK move is therefore a single change spread across a third of the
      # manifest: split into seventeen pull requests it is seventeen red builds,
      # and grouped it is one planned window. That is the shape FSEC-001
      # remediation item 4 asks for, and the reason the `expo-router@58`
      # advisories are still in dependency-audit-baseline.json rather than
      # fixed — the deep-link `query-string` → `decode-uri-component` chain,
      # which `app.json`'s three autoVerify App Link prefixes expose to
      # attacker-supplied input.
      #
      # `react` and `react-native` sit in this group rather than flowing on
      # their own because the SDK pins both to exact versions (`react: 19.2.3`,
      # `react-native: 0.86.0`). A lone bump of either is a build that cannot
      # pass, so it is not worth opening.
      #
      # The same argument reaches eleven more packages, and that is why they
      # are listed below. Each carries an SDK 57 pin in
      # `node_modules/expo/bundledNativeModules.json` while matching none of
      # the patterns above, so each used to flow as a pull request of its own.
      # #36 (`react-native-gesture-handler` 2.32.0 -> 3.5.0) is how that was
      # noticed, and it was the sixth instance rather than the first: measured
      # on 16 Nov 2026, five of the eleven were already installed past their
      # pin - `@react-native-async-storage/async-storage` at 3.1.1 against a
      # pin of 2.2.0, a whole major, together with `@shopify/flash-list`,
      # `react-native-maps`, `react-native-reanimated` and
      # `react-native-worklets`. Two of those five had merged the day before.
      # Nothing here showed any of them misbehaving; the point is that leaving
      # the SDK's tested matrix was never a decision anyone made, and this
      # project's CI - typecheck and Jest, with no native build and no
      # `expo-doctor` step - cannot be the thing that notices.
      #
      # Listed one by one rather than matched by `react-native-*`, because the
      # set is not a naming convention in either direction: it includes
      # `jest-expo` and `@shopify/flash-list`, which no `react-native-*`
      # pattern reaches, and it excludes `react-native-worklets-core`, an
      # independently versioned third-party library at 1.6.3 that tracks no
      # SDK line at all.
      #
      # The boundary was drawn wrong on the first pass, and the next Dependabot
      # run said so within minutes. That pass derived the list from
      # bundledNativeModules.json, which lists native modules - so it missed
      # the build and test tooling the SDK versions in lockstep regardless, and
      # the run promptly opened three lone pull requests for exactly that:
      # react-test-renderer 19.2.3 -> 19.3.1 against a react pinned at 19.2.3,
      # `@react-native/jest-preset` 0.86.2 -> 0.88.1 against a react-native
      # pinned at 0.86.0, and `babel-preset-expo` 57.0.2 -> 58.0.25 against
      # expo at ~57.0.4, which is an SDK major. The first pass had even cited
      # `@react-native/jest-preset` here as something to keep out, which was
      # wrong: the `@react-native/*` packages ship in lockstep with
      # react-native.
      #
      # `@types/react` is grouped for a narrower reason. Its `~19.2.2` range
      # already resolves inside react's minor line, so the only pull request it
      # can ever receive is the one that gets ahead of react.
      #
      # So the test is not whether bundledNativeModules.json pins it, but
      # whether the SDK versions it in lockstep - a strict superset. Re-derive
      # by checking every dependency against the three anchors: expo, react
      # and react-native.
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react
          - react-dom
          - react-native
          - '@react-native-async-storage/async-storage'
          - '@react-native/jest-preset'
          - '@shopify/flash-list'
          - '@types/react'
          - babel-preset-expo
          - jest-expo
          - react-native-gesture-handler
          - react-native-maps
          - react-native-reanimated
          - react-native-safe-area-context
          - react-native-screens
          - react-native-svg
          - react-native-web
          - react-native-worklets
          - react-test-renderer
        update-types:
          - major
          - minor
          - patch

    # Everything else flows one pull request at a time, deliberately: a lone
    # package's upgrade can be judged on its own changelog and merged the same
    # day, which is what should have been happening to `axios` and `zod` long
    # before an audit found them.

    # tailwindcss is the one exception to the paragraph above, and only for
    # majors. 4.x is a rewrite rather than an upgrade: the engine changed and
    # configuration moved out of `tailwind.config.js`, which this project
    # still has, and into CSS. #47 (3.4.19 -> 4.3.5) failed `Typecheck and
    # unit tests` on exactly that and was closed on 16 Nov 2026 - and closing
    # a Dependabot pull request declines only that release, so 4.3.6 would
    # open a fresh one that fails the same way, weekly, until somebody does
    # the migration.
    #
    # Worth recording that `nativewind` declares a peer range of
    # tailwindcss >3.3.0, which 4.3.5 satisfies. A permissive peer range is
    # not a compatibility statement and would never have warned here; CI was
    # the only thing that caught it.
    #
    # Minors and patches still flow normally. Delete this block when the v4
    # migration is actually planned: it is a deferral, not a verdict on v4.
    #
    # Check this before switching Dependabot *security* updates on. The
    # options reference says options marked with an icon also change how
    # Dependabot creates pull requests for security updates, and says
    # separately that update-types under `allow` affects version updates
    # only. Whether `ignore` falls in the first category could not be read
    # off the rendered page on 16 Nov 2026, so confirm it rather than assume
    # a tailwindcss advisory would still reach you. Nothing is exposed
    # today: security updates are a repository setting and it is still off.
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major

      # typescript is deliberately NOT in this list, and was for one day.
      # #56 (6.0.3 -> 7.0.2) was closed on 16 Nov 2026 because it could not
      # pass; the entry is gone because that reason is.
      #
      # 7.x is the Go rewrite (`microsoft/typescript-go`). #56 failed on two
      # configuration errors - TS5102 for `baseUrl`, which 7 removes, and
      # TS5090 for the non-relative `paths` entry that only `baseUrl` made
      # legal - and because 7 stops at a fatal configuration error, nothing
      # else was visible behind them. Removing `baseUrl` exposed 93 errors
      # that were all one error: TS2304, "Cannot find name 'global'", across
      # 14 test files. The sweep to `globalThis` that cleared them landed
      # with this comment. Measured 16 Nov 2026: 7.0.2 reports 0 errors.
      #
      # Two things worth knowing before the bump is merged.
      #
      # `tsc` runs in exactly one place here - the `typecheck` script. Babel
      # transpiles for both Metro and Jest, so TypeScript is never in a build
      # or a test, and a 7.x difference can only make the typecheck job wrong
      # in one direction or the other. That is a narrow blast radius.
      #
      # 7.0.2 ships no `tsserver`. 6.0.3 ships `tsc` and `tsserver`; 7.0.2
      # ships `tsc` alone. Nothing in this repository pins
      # `typescript.tsdk`, so no editor opts into the workspace version by
      # default, but anyone who has chosen "Use Workspace Version" in their
      # own editor loses language-server support the day it merges. It is a
      # developer-machine cost, invisible to CI, and the one thing a green
      # typecheck does not cover.

      # @testing-library/react-native majors are deferred, and this one is
      # deferred on its size rather than on a principle. 14.0.0 made the core
      # API async - render(), renderHook(), fireEvent() and act() all return
      # promises - and removed the UNSAFE_* queries.
      #
      # Measured 16 Nov 2026 against master at Expo SDK 58, so against the
      # React 19.3.1 and React Native 0.88.1 that 14.1.0 explicitly added
      # support for. The versions are not the problem:
      #
      #     tsc --noEmit   207 errors (195 TS2339, 12 TS7006)
      #     jest           1053 tests failed, 97 of 397 suites
      #
      # For scale, the SDK 58 upgrade itself - 30 packages, React Native
      # among them - was 49 type errors and no failing tests.
      #
      # #34 could never have passed, and not because it was red. 14.x swaps
      # its peer dependency: `react-test-renderer` out, `test-renderer
      # ^1.0.0` in. Dependabot bumps one package; it does not exchange two.
      # Whoever takes the migration adds `test-renderer` (the 1.3.x line, for
      # React 19.3), drops `react-test-renderer`, and removes it from the
      # expo-sdk group patterns above, where it was added on the same day
      # this was deferred.
      #
      # The async half has a codemod, `npx codemod@latest
      # rntl-v14-async-functions`. The other half does not. v14 exposes host
      # elements only, throws on text rendered outside a <Text>, and matches
      # getByRole names more strictly, so a share of those 1053 failures are
      # assertions that have to be read rather than rewritten. That is the
      # actual reason this is planned work rather than an afternoon: the fast
      # way through is to weaken what 97 suites check, and nothing in CI
      # would notice that happening.
      #
      # Minors and patches still flow. Delete this block when the migration
      # is scheduled.
      - dependency-name: '@testing-library/react-native'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
