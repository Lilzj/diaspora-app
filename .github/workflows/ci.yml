name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CI: true

jobs:
  # ── What can be proved without the other repository ────────────────────────
  #
  # Types and unit tests. Green here has always been achievable while the app
  # was broken against the real backend — which is the whole reason the second
  # job exists.
  static-and-unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # FSEC-001: this repository had no dependency audit of any kind, while the
      # backend fails its build on any moderate-or-worse advisory and reports
      # zero vulnerable packages. The difference between the two repositories
      # was exactly one CI step, and it is this one.
      #
      # Not `npm audit --audit-level=high --omit=dev`, which the finding
      # recommended: measured on 13 November 2026 it exits 1, because the build
      # tooling arrives through `react-native` and `expo`, which are runtime
      # dependencies, so `--omit=dev` does not describe what ships. The script
      # explains the rest; the short version is that every advisory is either
      # fixed or written down in dependency-audit-baseline.json, and the build
      # fails when that set changes in either direction.
      #
      # Before the typecheck, mirroring the backend's scan-before-build order:
      # a dependency advisory is a property of the commit, not of the code that
      # happens to compile on top of it.
      - name: Dependency audit
        run: node scripts/dependency-audit.js

      # Separate steps so a type error is reported as a type error rather than
      # buried in a test run that could not compile.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --silent

  # ── What the two repositories say about each other ────────────────────────
  #
  # Eleven suites read the backend checkout: the emitted OpenAPI contract, and
  # the C# sources for enums, options and rule classes the client mirrors. They
  # find it through `DIASPORA_BACKEND_PATH`, and nothing in this workflow set it
  # until 11 November 2026 — so all eleven skipped on every pull request and
  # every push, quietly, inside a green unit job. That is FBL-001, and the gap
  # it left open is the one the job below this was already built to close: a
  # defect that lives between the two repositories while both suites are green.
  #
  # A job of its own rather than folded into `static-and-unit`, for the reason
  # that job's neighbour already states: a skipped job is honest and visible in
  # the checks list, where eleven skipped `describe`s inside a passing job are
  # neither.
  #
  # This job was gated on `vars.BACKEND_REPOSITORY` so that it could no-op where
  # the backend was unreachable, and that gate rested on a premise nobody
  # checked: that `Lilzj/diaspora-backend` is private, and so needs a token a
  # fork could never be given. **It is public.** Measured 14 November 2026 two
  # ways — an anonymous `git ls-remote` with the credential helper disabled, and
  # an unauthenticated fetch of the upload-pack advertisement — both of which
  # returned master's SHA. A public repository is readable with the workflow's
  # own `GITHUB_TOKEN`, which `actions/checkout` already uses by default and
  # which even a fork's read-only token can clone with.
  #
  # So there was never anything to configure, and the gate's only effect was to
  # make this job skip on every run from the day it was written. Ungated now,
  # with the repository named here rather than in a variable, so that the check
  # is a property of this workflow and not of a setting someone has to remember.
  # If the checkout fails the job *fails*, and `support/backend-checkout.ts`
  # likewise *fails* rather than skips when the path is named and wrong, so a
  # broken checkout cannot repeat the finding in a new costume.
  contract-drift:
    name: Contract drift against the backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DRIFT_SUITES: '(advertising-enum-drift|backend-gap-register-drift|backend-openapi-contract-drift|backend-request-binding-drift|backend-row-property-drift|creator-earning-drift|password-policy-drift|reputation-rules-drift|screen-response-field-drift|step-up-claims-drift|withdrawal-status|served-routes-drift)'

    steps:
      - name: Check out the client
        uses: actions/checkout@v4

      # `path: backend`, not `../diaspora-backend`: actions/checkout refuses any
      # path outside $GITHUB_WORKSPACE. The job below does it the same way.
      #
      # `secrets.BACKEND_TOKEN || github.token`: an unset secret is the empty
      # string in a GitHub expression, so with nothing configured this resolves
      # to the workflow's own token, which can clone a public repository — and
      # so can a fork's read-only one. Demanding a secret that never needed to
      # exist is what kept this job switched off for three days.
      #
      # The fallback is not decoration. Omitting `token:` would make this job
      # depend on the backend staying public, silently, with nothing in the file
      # saying so. With the fallback, making the backend private again is
      # survivable — add the secret and the job carries on — and if it goes
      # private with no secret the checkout *fails* rather than skipping, which
      # `cross-repository-verified` below reports as a failure.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: Lilzj/diaspora-backend
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Counted before they are run, and this is not belt-and-braces. `jest`
      # exits **0** on an unrecognised CLI option: `--testPathPatterns` instead
      # of `--testPathPattern` prints "Unrecognized option" and returns success.
      # A typo in the pattern below would therefore be a green job that ran
      # nothing at all — FBL-001 again, from a different direction. `|| true`
      # because `grep -c` exits non-zero on zero matches and this shell is -e.
      # Twelve since 13 November 2026: step-up-claims-drift joined when FSEC-002
      # replaced a false security claim with a true one, and the true one needs
      # the server to keep being true.
      - name: All twelve suites are still here
        run: |
          found=$(npx jest --listTests --testPathPattern "$DRIFT_SUITES" | grep -c 'test\.ts' || true)
          echo "matched $found suites"
          if [ "$found" -ne 12 ]; then
            echo "::error::Expected 12 contract-drift suites, matched $found. A suite was"
            echo "::error::renamed, deleted, or DRIFT_SUITES no longer names it. Running"
            echo "::error::fewer than twelve is the finding this job exists to close."
            exit 1
          fi

      - name: Contract and drift suites
        env:
          DIASPORA_BACKEND_PATH: ${{ github.workspace }}/backend
        run: npm test -- --ci --silent --testPathPattern "$DRIFT_SUITES"

  # ── The check that the check ran ──────────────────────────────────────────
  #
  # FBL-001's remediation item 2: "make the skip a failure under CI". The job
  # above is gated on `vars.BACKEND_REPOSITORY != ''`, and an unsatisfied gate
  # produces a *skipped* job — which GitHub counts toward the green tick.
  #
  # Measured on 14 November 2026, merging PR #38: the merge box read **"All
  # checks have passed — 2 skipped, 1 successful checks"**, with the tick drawn
  # and the merge button enabled. The two skips were the two jobs here. Nothing
  # in `ci.yml` is wrong for that to happen; the wording is GitHub's, and the
  # only way to see it is to expand a list the merge flow never makes you open.
  #
  # So the sharper reading of FBL-001 is not "the suites skip" but **"a skip is
  # indistinguishable from a pass"**. Moving eleven skipped `describe`s into a
  # skipped job made the gap visible to a reader; it did not make it visible to
  # the merge button. A job that *fails* is the only shape GitHub cannot round
  # up, and this is that job.
  #
  # Deliberately ungated — that is the entire point.
  #
  # It carried one exemption until 14 November 2026, for forks, on the premise
  # that a fork cannot check out a private backend. The backend is public, so a
  # fork's read-only `GITHUB_TOKEN` clones it like any other and the exemption
  # was a hole held open for a case that cannot arise. **An exemption whose
  # reason is false is the same species of defect as the skip it was written to
  # catch**, and this one would have let any fork pull request merge with the
  # cross-repository check quietly absent. `!cancelled()` rather than `always()`
  # so a cancelled run does not report a false failure.
  cross-repository-verified:
    name: Cross-repository verification actually ran
    runs-on: ubuntu-latest
    needs: [contract-drift]

    if: ${{ !cancelled() }}

    steps:
      - name: The contract-drift job reports success
        env:
          RESULT: ${{ needs.contract-drift.result }}
        run: |
          echo "contract-drift reported: $RESULT"

          case "$RESULT" in
            success)
              echo "The twelve cross-repository suites ran against a backend checkout."
              ;;
            skipped)
              echo "::error::Cross-repository verification did not run, so the platform's"
              echo "::error::only automated check that client and server agree has not"
              echo "::error::passed — it was never asked."
              echo "::error::"
              echo "::error::contract-drift takes no configuration and carries no condition,"
              echo "::error::so for it to skip, someone has added an 'if:' to that job or"
              echo "::error::dropped it from this job's 'needs:'. Put it back rather than"
              echo "::error::relaxing this check: a skipped job counts toward GitHub's"
              echo "::error::\"All checks have passed\", which is the whole of FBL-001."
              exit 1
              ;;
            *)
              echo "::error::The contract-drift job reported '$RESULT' rather than success."
              echo "::error::The twelve cross-repository suites did not pass."
              exit 1
              ;;
          esac

  # ── What can only be proved against the real backend ──────────────────────
  #
  # The gap this repository has always had, stated in its own notes: the two
  # repositories have thorough suites and **not one test asserts anything about
  # the other**. Every defect the runtime programme found lived in that gap —
  # a member who could not list an item for sale, a card whose every tap went to
  # `/marketplace/undefined`, a country-scoped housing search that returned
  # nothing — with both suites green throughout.
  #
  # This job runs `runtime-validation/e2e` against a real `Diaspora.Api` and a
  # real PostgreSQL. It is the only thing here that could have caught them.
  runtime-integration:
    name: Runtime integration against a real backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The one job here that is genuinely opt-in, and for a reason that is about
    # cost rather than reachability: it builds the API, migrates PostgreSQL and
    # runs the whole sweep. Forty-five minutes on every pull request is the
    # repository owner's call, not this file's.
    #
    # It used to be gated on `vars.BACKEND_REPOSITORY`, under the comment "the
    # repo is not public and a fork has no way to check it out". That was false
    # — see `contract-drift` above — and sharing a gate with a job that needs
    # none would have made setting that variable a forty-five minute surprise.
    # Named for what it actually controls instead: set `RUNTIME_INTEGRATION` to
    # `on` to run it. Nothing else in this workflow reads it.
    if: vars.RUNTIME_INTEGRATION == 'on'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diaspora_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the client
        uses: actions/checkout@v4

      # Same reasoning as `contract-drift` above.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: Lilzj/diaspora-backend
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - run: npm ci

      # `--connection` explicitly. Without it `dotnet ef` reads appsettings.json
      # rather than appsettings.Development.json and migrates a database named
      # `diaspora`, which the application then does not open — and reports
      # success either way. Documented in runtime-validation/README.md §2.
      - name: Apply migrations
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/Diaspora.Persistence \
            --startup-project src/Diaspora.Api \
            --connection "Host=127.0.0.1;Port=5432;Database=diaspora_dev;Username=postgres;Password=postgres"

      - name: Build the API
        working-directory: backend
        run: dotnet build src/Diaspora.Api/Diaspora.Api.csproj -c Debug

      # The two settings and why each is there, from runtime-validation/README.md:
      #
      #   Identity__Jwt__SigningKey  DEFECT-001. Without it no access token can be
      #                              issued at all. The value is the literal
      #                              JwtBearerOptionsConfigurator already uses for
      #                              validation, so the two halves agree.
      #   RateLimiting__Enabled      registration is 5 per 300s and the sweep
      #                              creates more identities than that.
      #
      # The log is redirected because development OTP delivery writes the live
      # verification code to it, which is the only way to create identities
      # through the real registration API.
      - name: Start the API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5099
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=diaspora_dev;Username=postgres;Password=postgres
          Identity__Jwt__SigningKey: diaspora-development-signing-key-not-for-any-deployed-environment
          RateLimiting__Enabled: 'false'
        run: |
          nohup dotnet run --project src/Diaspora.Api/Diaspora.Api.csproj \
            --no-build --no-launch-profile > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5099/health/ready; then
              echo "API ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::The API did not become ready."
          tail -50 "$GITHUB_WORKSPACE/api.log"
          exit 1

      # `RUNTIME_RUN` seeds the phone-number block and must differ between runs,
      # or every registration becomes a duplicate-account test. The run number
      # gives a fresh block per CI run.
      - name: Runtime sweep
        env:
          RUNTIME_API_LOG: ${{ github.workspace }}/api.log
          RUNTIME_API_ORIGIN: http://127.0.0.1:5099
        run: npm run e2e -- --run ${{ github.run_number }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: |
            runtime-validation/e2e/evidence-*.json
            runtime-validation/e2e/results-*.json
            api.log
          retention-days: 14
